<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 880" preserveAspectRatio="none">
  <defs>
    <radialGradient id="frame" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#7d5532"/>
      <stop offset="55%" stop-color="#5a3820"/>
      <stop offset="100%" stop-color="#3f2716"/>
    </radialGradient>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0 0.03  0 0 0 0.55 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="w" cx="40%" cy="35%"><stop offset="0%" stop-color="#fffbe6"/><stop offset="100%" stop-color="#c9bf94"/></radialGradient>
    <radialGradient id="u" cx="40%" cy="35%"><stop offset="0%" stop-color="#b8e3ff"/><stop offset="100%" stop-color="#1f6fb5"/></radialGradient>
    <radialGradient id="b" cx="40%" cy="35%"><stop offset="0%" stop-color="#8a8080"/><stop offset="100%" stop-color="#1c1717"/></radialGradient>
    <radialGradient id="r" cx="40%" cy="35%"><stop offset="0%" stop-color="#ffb48a"/><stop offset="100%" stop-color="#c0321c"/></radialGradient>
    <radialGradient id="g" cx="40%" cy="35%"><stop offset="0%" stop-color="#a8e6a0"/><stop offset="100%" stop-color="#1f7a35"/></radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8cc8ff"/>
      <stop offset="35%" stop-color="#2f7bd0"/>
      <stop offset="100%" stop-color="#0d2f6b"/>
    </linearGradient>
    <radialGradient id="oval" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#b98e60"/>
      <stop offset="100%" stop-color="#8c6438"/>
    </radialGradient>
  </defs>

  <!-- Black outer border -->
  <rect width="630" height="880" rx="32" fill="#0d0d0d"/>

  <!-- Mottled brown frame -->
  <rect x="26" y="26" width="578" height="828" rx="14" fill="url(#frame)"/>
  <rect x="26" y="26" width="578" height="828" rx="14" fill="#000" filter="url(#mottle)"/>

  <!-- Central light brown oval with blue trim -->
  <ellipse cx="315" cy="440" rx="235" ry="330" fill="#0b1a33"/>
  <ellipse cx="315" cy="440" rx="220" ry="315" fill="url(#oval)"/>
  <ellipse cx="315" cy="440" rx="220" ry="315" fill="none" stroke="#3f8fe0" stroke-width="8"/>

  <!-- Five mana orbs arranged in a pentagon -->
  <g stroke="#1a0f05" stroke-width="4">
    <circle cx="315" cy="300" r="34" fill="url(#w)"/>
    <circle cx="420" cy="380" r="34" fill="url(#u)"/>
    <circle cx="380" cy="510" r="34" fill="url(#b)"/>
    <circle cx="250" cy="510" r="34" fill="url(#r)"/>
    <circle cx="210" cy="380" r="34" fill="url(#g)"/>
  </g>

  <!-- "Deckmaster"-style logo: Beleren text (converted to paths) on a blue banner -->
  <g transform="translate(315 805) skewX(-10)">
    <rect x="-222" y="-31" width="444" height="62" rx="31" fill="#0b1a33"/>
    <rect x="-216" y="-25" width="432" height="50" rx="25" fill="url(#banner)" stroke="#cfe8ff" stroke-width="2.5"/>
  </g>
